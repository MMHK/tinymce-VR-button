<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyMCE VR Button Plugin Demo</title>
    
    <!-- TinyMCE 4.0.26 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/4.0.26/tinymce.min.js"></script>
    
    <!-- VR Button Plugin CSS -->
    <link rel="stylesheet" href="css/vr-button.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .info h3 {
            margin-top: 0;
            color: #1976d2;
        }
        
        .info ul {
            margin: 10px 0;
        }
        
        .editor-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .preview-section {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .preview-section h2 {
            margin-top: 0;
            color: #333;
        }
        
        #preview {
            border: 1px solid #ddd;
            padding: 20px;
            min-height: 200px;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <h1>🎮 TinyMCE VR Button Plugin Demo</h1>
    
    <div class="info">
        <h3>使用说明 / Instructions</h3>
        <ul>
            <li>点击工具栏的 VR 图标按钮</li>
            <li>在弹出的对话框中输入 720yun 链接（如：https://720yun.com/t/xxxxx）</li>
            <li>编辑器中会插入一个 VR 360° 按钮</li>
            <li>Desktop: 点击按钮会在 inline iframe 中展开 VR 视图</li>
            <li>Mobile: 点击按钮会在新窗口打开 VR 链接</li>
        </ul>
        <p><strong>示例链接:</strong> <code>https://720yun.com/t/xxxxx</code></p>
    </div>
    
    <div class="editor-container">
        <textarea id="tinymce-editor">
            <h2>欢迎使用 VR 360° 插件</h2>
            <p>这是一个演示页面。点击上方工具栏的 VR 图标来插入 720yun VR 链接。</p>
            <p>试试插入一个链接，然后点击生成的按钮查看效果！</p>
        </textarea>
    </div>
    
    <div class="preview-section">
        <h2>预览 / Preview</h2>
        <div id="preview"></div>
    </div>

    <script>
        // Initialize TinyMCE with VR Button plugin
        tinymce.init({
            selector: '#tinymce-editor',
            height: 400,
            plugins: [
                'vrbutton',
                'advlist autolink lists link image charmap print preview anchor',
                'searchreplace visualblocks code fullscreen',
                'insertdatetime media table contextmenu paste'
            ],
            toolbar: 'vrbutton | insertfile undo redo | styleselect | bold italic | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | link image',
            external_plugins: {
                'vrbutton': 'plugin.js'
            },
            content_css: 'css/vr-button.css',
            setup: function(editor) {
                editor.on('change keyup', function() {
                    document.getElementById('preview').innerHTML = editor.getContent();
                });
            }
        });
        
        // Initial preview
        document.addEventListener('DOMContentLoaded', function() {
            var editor = tinymce.get('tinymce-editor');
            if (editor) {
                document.getElementById('preview').innerHTML = editor.getContent();
            }
        });
    </script>
</body>
</html>
